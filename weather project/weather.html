<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div class="container">
        <div class="search">
            <input type="text"placeholder="Enter city Name">
            <button><img src="search.png"></button>
        </div>
        <div class="weather">
                <img src="rainy pic.jpg">
                <h1 class="temp">22°C</h1>
                <h2 class="city">Nowshera</h2>

                 <div class="details">
                    <div class="Humdity">
                        <p>50%</p>
                        <p>Humdity</p>
                    </div>
                 <div class="wind">
                        <p>50km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div> 
            
        </div>
    
        
    </div>
    <script src="waether.js"></script>
</body>
</html>
